<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe8" />
  <title>Vakinha do Edu</title>
  <style>
    :root {
      --bg: #f4efe8;
      --card: rgba(255, 255, 255, 0.82);
      --text: #171412;
      --muted: #776f68;
      --button: #171412;
      --button-text: #ffffff;
      --border: rgba(23, 20, 18, 0.08);
      --shadow: 0 24px 70px rgba(44, 34, 28, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.95), transparent 42%),
        radial-gradient(circle at bottom right, rgba(218,196,174,.55), transparent 40%),
        var(--bg);
    }

    .card {
      width: min(100%, 430px);
      padding: 42px 26px 28px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(43, 31, 24, 0.09);
      font-size: 31px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 9vw, 48px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    p {
      margin: 16px auto 28px;
      max-width: 310px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      background: var(--button);
      color: var(--button-text);
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease;
      box-shadow: 0 12px 28px rgba(23, 20, 18, 0.22);
    }

    button:active {
      transform: scale(.98);
    }

    button.copied {
      background: #276749;
    }

    .note {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 36px 20px 24px; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">❤</div>
    <h1>Vakinha do Edu</h1>
    <p>Toque no botão abaixo para copiar a chave PIX e ajudar.</p>

    <button id="copyButton" type="button">Copiar chave PIX</button>
    <div class="note" id="feedback" aria-live="polite"></div>
  </main>

  <script>
    const pixKey = "0d02b8bb-4dc1-4bdb-b14b-1a71384e21f0";
    const button = document.getElementById("copyButton");
    const feedback = document.getElementById("feedback");

    async function copyPixKey() {
      try {
        await navigator.clipboard.writeText(pixKey);
      } catch (error) {
        const input = document.createElement("textarea");
        input.value = pixKey;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      button.textContent = "Chave copiada!";
      button.classList.add("copied");
      feedback.textContent = "Agora é só colar no aplicativo do seu banco.";

      setTimeout(() => {
        button.textContent = "Copiar chave PIX";
        button.classList.remove("copied");
        feedback.textContent = "";
      }, 2500);
    }

    button.addEventListener("click", copyPixKey);
  </script>
</body>
</html>
